<p-toolbar styleClass="bg-white shadow-2 border-bottom-1 border-gray-200">
  <div class="p-toolbar-group-start pl-2">
    <a routerLink="/dashboard" class="flex align-items-center gap-2 no-underline text-primary">
      <i class="pi pi-prime text-2xl"></i>
      <h3 class="m-0 text-xl font-semibold">ClínicaMédica</h3>
    </a>
  </div>

  <div class="p-toolbar-group-end pr-2">
    <ng-container *ngIf="usuario() as user">
      <div class="flex align-items-center gap-2">
        <p-avatar
          [label]="user.nome.charAt(0).toUpperCase()"
          shape="circle"
          styleClass="bg-primary text-white"
        ></p-avatar>

        <span class="font-medium hidden md:block">{{ user.nome }}</span>
      </div>
    </ng-container>

    <p-button
      icon="pi pi-sign-out"
      styleClass="p-button-text p-button-danger ml-3"
      (click)="logout()"
      pTooltip="Sair"
      tooltipPosition="bottom"
    ></p-button>
  </div>
</p-toolbar>
