<div class="header-container">
  <div class="header-left">
    <h2 class="header-title">
      <i class="pi pi-hospital text-primary"></i>
      Clínica Médica
    </h2>
  </div>

  <div class="header-right">
    <ng-container *ngIf="usuario() as user">
      <div class="user-info">
        <p-avatar
          [label]="user.nome.charAt(0).toUpperCase()"
          shape="circle"
          styleClass="user-avatar"
          [style]="{ 'background': 'linear-gradient(135deg, #667eea 0%, #764ba2 100%)' }"
        ></p-avatar>
        <div class="user-details">
          <span class="user-name">{{ user.nome }}</span>
          <span class="user-role">{{ user.perfil }}</span>
        </div>
      </div>

      <p-button
        icon="pi pi-sign-out"
        label="Sair"
        styleClass="p-button-text p-button-danger logout-btn"
        (click)="logout()"
        pTooltip="Sair do sistema"
        tooltipPosition="bottom"
      />
    </ng-container>
  </div>
</div>
