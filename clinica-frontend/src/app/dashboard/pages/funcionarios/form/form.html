<p-toast></p-toast>

<p-card>
  <form [formGroup]="form" (ngSubmit)="onSubmit()">
    <ng-template pTemplate="header">
      <h2 class="p-3 mb-0">{{ isEdit ? 'Editar Funcionário' : 'Novo Funcionário' }}</h2>
    </ng-template>

    <div class="grid p-fluid">
      <div class="field col-12 md:col-6">
        <label for="nome">Nome Completo</label>
        <input id="nome" type="text" pInputText formControlName="nome" />
        <small *ngIf="form.get('nome')?.invalid && form.get('nome')?.dirty" class="p-error">
          O nome é obrigatório.
        </small>
      </div>

      <div class="field col-12 md:col-3">
        <label for="tipo">Tipo</label>
        <select
          id="tipo"
          class="p-inputtext p-component"
          formControlName="tipo"
        >
          <option value="" disabled selected>Selecione o tipo</option>
          <option *ngFor="let tipo of tiposFuncionario" [value]="tipo.value">
            {{ tipo.label }}
          </option>
        </select>
        <small *ngIf="form.get('tipo')?.invalid && form.get('tipo')?.dirty" class="p-error">
          O tipo é obrigatório.
        </small>
      </div>

      <div *ngIf="form.get('tipo')?.value === 'MEDICO'" class="field col-12 md:col-3">
        <label for="crm">CRM</label>
        <input id="crm" type="text" pInputText placeholder="Ex: 12345-MG" formControlName="crm" />
        <small *ngIf="form.get('crm')?.invalid && form.get('crm')?.dirty" class="p-error">
          CRM é obrigatório para médicos.
        </small>
      </div>

      <div class="field col-12 md:col-6">
        <label for="telefone">Telefone</label>
        <input id="telefone" type="text" pInputText formControlName="telefone" />
      </div>
    </div>

    <ng-template pTemplate="footer">
      <div class="flex gap-2">
        <p-button
          label="Salvar"
          icon="pi pi-check"
          [loading]="loading"
          [disabled]="form.invalid || loading"
          type="submit"
        ></p-button>

        <p-button
          label="Cancelar"
          icon="pi pi-times"
          styleClass="p-button-outlined"
          routerLink="/dashboard/funcionarios"
          type="button"
        ></p-button>
      </div>
    </ng-template>
  </form>
</p-card>
