<p-toast />
<div class="card">
  <p-table
    [value]="funcionarios"
    [lazy]="true"
    (onLazyLoad)="carregarFuncionarios($event)"
    [paginator]="true"
    [rows]="10"
    [totalRecords]="totalRecords"
    [loading]="loading"
    [rowsPerPageOptions]="[10, 20, 30]"
    [showCurrentPageReport]="true"
    currentPageReportTemplate="Mostrando {first} a {last} de {totalRecords} funcionários"
    styleClass="p-datatable-striped"
  >
    <ng-template pTemplate="caption">
      <div class="flex justify-content-between flex-wrap">
        <h2 class="m-0">Gerenciar Funcionários</h2>
        <div class="flex gap-2">
          <input
            pInputText
            type="text"
            placeholder="Buscar por nome ou CRM..."
            class="w-full md:w-auto"
          />
          <p-button label="Novo" icon="pi pi-plus" routerLink="novo" />
        </div>
      </div>
    </ng-template>

    <ng-template pTemplate="header">
      <tr>
        <th pSortableColumn="nome">Nome <p-sortIcon field="nome" /></th>
        <th style="width: 10rem">Tipo</th>
        <th style="width: 10rem">CRM</th>
        <th style="width: 10rem">Ações</th>
      </tr>
    </ng-template>

    <ng-template pTemplate="body" let-func>
      <tr>
        <td>{{ func.nome }}</td>
        <td>
          <p-tag [value]="func.tipo" [severity]="func.tipo === 'MEDICO' ? 'success' : 'info'" />
        </td>
        <td>{{ func.crm || 'N/A' }}</td>
        <td>
          <p-button icon="pi pi-pencil" styleClass="p-button-text p-button-info" />
          <p-button icon="pi pi-trash" styleClass="p-button-text p-button-danger" />
        </td>
      </tr>
    </ng-template>

    <ng-template pTemplate="emptymessage">
      <tr>
        <td colspan="4" class="text-center">Nenhum funcionário encontrado.</td>
      </tr>
    </ng-template>
  </p-table>
</div>
